<?xml version="1.0" encoding="UTF-8"?>
<svg
  viewBox="0 0 170 56"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="WooCommerce and Shopify two-way sync"
>

  <!-- Main container -->
  <rect
    x="1"
    y="1"
    width="168"
    height="54"
    rx="6"
    fill="#FFFFFF"
    stroke="#E2E8F0"
    stroke-width="1.2"
  />

  <!-- WooCommerce → Sync -->
  <line
    x1="44"
    y1="28"
    x2="68"
    y2="28"
    stroke="#7047A0"
    stroke-width="3.5"
    stroke-dasharray="2 4"
    stroke-linecap="round"
  />

  <!-- Sync → Shopify -->
  <line
    x1="102"
    y1="28"
    x2="126"
    y2="28"
    stroke="#95BF47"
    stroke-width="3.5"
    stroke-dasharray="2 4"
    stroke-linecap="round"
  />

  <!-- ========================= -->
  <!-- WooCommerce -->
  <!-- ========================= -->
  <g transform="translate(26 28)">

    <circle
      cx="0"
      cy="0"
      r="17"
      fill="#7047A0"
    />

    <!-- Woo speech bubble -->
    <path
      d="
        M-9.5-5.5
        C-9.5-8-8-9.5-5.5-9.5
        H5.5
        C8-9.5 9.5-8 9.5-5.5
        V3
        C9.5 5.5 8 7 5.5 7
        H-1.5
        L-5.5 10.5
        V7
        H-5.5
        C-8 7-9.5 5.5-9.5 3
        Z
      "
      fill="#FFFFFF"
    />

    <text
      x="-0.5"
      y="2"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="900"
      font-size="8"
      fill="#7047A0"
      text-anchor="middle"
      letter-spacing="-0.5"
    >Woo</text>

  </g>


  <!-- ========================= -->
  <!-- Two-way Sync -->
  <!-- ========================= -->
  <g transform="translate(85 28)">

    <circle
      cx="0"
      cy="0"
      r="11"
      fill="#FFFFFF"
      stroke="#CBD5E1"
      stroke-width="1"
    />

    <!-- Purple sync arrow -->
    <path
      d="M-5-2 A5.5 5.5 0 0 1 4-4"
      stroke="#7047A0"
      stroke-width="2"
      stroke-linecap="round"
      fill="none"
    />

    <path
      d="M1.5-6 L5.5-4 L3.5-0.5"
      fill="#7047A0"
    />

    <!-- Shopify green sync arrow -->
    <path
      d="M5 2 A5.5 5.5 0 0 1-4 4"
      stroke="#95BF47"
      stroke-width="2"
      stroke-linecap="round"
      fill="none"
    />

    <path
      d="M-1.5 6 L-5.5 4 L-3.5 0.5"
      fill="#95BF47"
    />

  </g>


  <!-- ========================= -->
  <!-- Online store (generic mark) -->
  <!-- ========================= -->
  <!--
    A neutral shopping-bag glyph drawn for this project. It stands for the
    connected storefront generally; no third-party logo or brand mark is
    reproduced here.
  -->
  <g transform="translate(144 28)">

    <!-- White background -->
    <circle
      cx="0"
      cy="0"
      r="17"
      fill="#FFFFFF"
      stroke="#95BF47"
      stroke-width="1.5"
    />

    <!-- Bag handle -->
    <path
      d="M-4.4-3.4 V-5.6 A4.4 4.4 0 0 1 4.4-5.6 V-3.4"
      fill="none"
      stroke="#5E8E3E"
      stroke-width="1.9"
      stroke-linecap="round"
    />

    <!-- Bag body -->
    <path
      d="
        M-8.6-3.4
        H8.6
        A1.8 1.8 0 0 1 10.4-1.4
        L9.3 8.4
        A2.4 2.4 0 0 1 6.9 10.6
        H-6.9
        A2.4 2.4 0 0 1-9.3 8.4
        L-10.4-1.4
        A1.8 1.8 0 0 1-8.6-3.4
        Z
      "
      fill="#95BF47"
    />

    <!-- Darker side panel, for depth -->
    <path
      d="
        M3.6-3.4
        H8.6
        A1.8 1.8 0 0 1 10.4-1.4
        L9.3 8.4
        A2.4 2.4 0 0 1 6.9 10.6
        H3.6
        Z
      "
      fill="#5E8E3E"
    />

  </g>

</svg>
