<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" width="580" height="220" role="img" aria-label="A WooCommerce marketplace and a Shopify store joined by a two-way sync hub">
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#243147"/><stop offset="1" stop-color="#1a2537"/>
  </linearGradient>
  <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2b6be3"/><stop offset="1" stop-color="#8e5cd9"/>
  </linearGradient>
  <linearGradient id="flowOut" x1="162" y1="0" x2="418" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#7F54B3"/><stop offset="1" stop-color="#5E8E3E"/>
  </linearGradient>
  <linearGradient id="flowBack" x1="418" y1="0" x2="162" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#5E8E3E"/><stop offset="1" stop-color="#7F54B3"/>
  </linearGradient>
  <radialGradient id="glowMid"><stop offset="0" stop-color="#2b6be3" stop-opacity="0.22"/><stop offset="1" stop-color="#2b6be3" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowL"><stop offset="0" stop-color="#7F54B3" stop-opacity="0.22"/><stop offset="1" stop-color="#7F54B3" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowR"><stop offset="0" stop-color="#5E8E3E" stop-opacity="0.22"/><stop offset="1" stop-color="#5E8E3E" stop-opacity="0"/></radialGradient>
  <radialGradient id="gloss" cx="0.5" cy="0.1" r="0.75">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <filter id="lift" x="-45%" y="-45%" width="190%" height="190%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b1220" flood-opacity="0.48"/>
  </filter>
  <filter id="hubGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="10" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
</defs>

<!-- ambient depth -->
<circle cx="290" cy="110" r="126" fill="url(#glowMid)"/>
<circle cx="104" cy="110" r="88"  fill="url(#glowL)"/>
<circle cx="476" cy="110" r="88"  fill="url(#glowR)"/>

<!-- the marketplace holds many seller shops -->
<rect x="40" y="46" width="96" height="96" rx="24" fill="#223049" stroke="#334155" stroke-width="2" opacity="0.6"/>
<rect x="48" y="54" width="96" height="96" rx="24" fill="#223049" stroke="#334155" stroke-width="2" opacity="0.85"/>

<!-- two-way flow, drawn behind the hub -->
<path d="M162,96 C214,42 366,42 418,96" fill="none" stroke="url(#flowOut)" stroke-width="2.6" stroke-linecap="round" opacity="0.6"/>
<path d="M418,124 C366,178 214,178 162,124" fill="none" stroke="url(#flowBack)" stroke-width="2.6" stroke-linecap="round" opacity="0.6"/>
<circle cx="203.6" cy="70.1" r="2.2" fill="url(#flowOut)" opacity="0.3"/>
<circle cx="253.6" cy="57.8" r="2.9" fill="url(#flowOut)" opacity="0.45"/>
<circle cx="326.4" cy="57.8" r="3.6" fill="url(#flowOut)" opacity="0.62"/>
<circle cx="376.4" cy="70.1" r="4.3" fill="url(#flowOut)" opacity="0.8"/>
<circle cx="376.4" cy="149.9" r="2.2" fill="url(#flowBack)" opacity="0.3"/>
<circle cx="326.4" cy="162.2" r="2.9" fill="url(#flowBack)" opacity="0.45"/>
<circle cx="253.6" cy="162.2" r="3.6" fill="url(#flowBack)" opacity="0.62"/>
<circle cx="203.6" cy="149.9" r="4.3" fill="url(#flowBack)" opacity="0.8"/>
<g transform="translate(418,96) rotate(46)"><path d="M0,0 L-11,-6 L-11,6 Z" fill="#5E8E3E"/></g>
<g transform="translate(162,124) rotate(226)"><path d="M0,0 L-11,-6 L-11,6 Z" fill="#7F54B3"/></g>

<!-- WooCommerce marketplace -->
<g filter="url(#lift)">
  <rect x="56" y="62" width="96" height="96" rx="24" fill="url(#card)" stroke="#374862" stroke-width="2"/>
</g>
<rect x="57" y="63" width="94" height="94" rx="23" fill="url(#gloss)"/>
<svg x="76" y="82" width="56" height="56" viewBox="0 0 100 100"><path d="M80,15 H20 C9,15 0,24 0,35 V60 C0,71 9,80 20,80 H65 L82,93 C83.5,94 85,93 85,91 V80 H80 C91,80 100,71 100,60 V35 C100,24 91,15 80,15 Z" fill="#7F54B3"/><text x="47" y="59" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-weight="900" font-style="italic" font-size="30" fill="#FFFFFF" text-anchor="middle">Woo</text></svg>

<!-- the seller's Shopify store -->
<g filter="url(#lift)">
  <rect x="428" y="62" width="96" height="96" rx="24" fill="url(#card)" stroke="#374862" stroke-width="2"/>
</g>
<rect x="429" y="63" width="94" height="94" rx="23" fill="url(#gloss)"/>
<svg x="452.2" y="83" width="47.5" height="54" viewBox="0 0 109.5 124.5"><g> <path fill="#95BF47" d="M95.9,23.9c-0.1-0.6-0.6-1-1.1-1c-0.5,0-9.3-0.2-9.3-0.2s-7.4-7.2-8.1-7.9c-0.7-0.7-2.2-0.5-2.7-0.3 c0,0-1.4,0.4-3.7,1.1c-0.4-1.3-1-2.8-1.8-4.4c-2.6-5-6.5-7.7-11.1-7.7c0,0,0,0,0,0c-0.3,0-0.6,0-1,0.1c-0.1-0.2-0.3-0.3-0.4-0.5 c-2-2.2-4.6-3.2-7.7-3.1c-6,0.2-12,4.5-16.8,12.2c-3.4,5.4-6,12.2-6.8,17.5c-6.9,2.1-11.7,3.6-11.8,3.7c-3.5,1.1-3.6,1.2-4,4.5 c-0.3,2.5-9.5,73-9.5,73l76.4,13.2l33.1-8.2C109.5,115.8,96,24.5,95.9,23.9z M67.2,16.8c-1.8,0.5-3.8,1.2-5.9,1.8 c0-3-0.4-7.3-1.8-10.9C64,8.6,66.2,13.7,67.2,16.8z M57.2,19.9c-4,1.2-8.4,2.6-12.8,3.9c1.2-4.7,3.6-9.4,6.4-12.5 c1.1-1.1,2.6-2.4,4.3-3.2C56.9,11.6,57.3,16.5,57.2,19.9z M49.1,4c1.4,0,2.6,0.3,3.6,0.9C51.1,5.8,49.5,7,48,8.6 c-3.8,4.1-6.7,10.5-7.9,16.6c-3.6,1.1-7.2,2.2-10.5,3.2C31.7,18.8,39.8,4.3,49.1,4z"/> <g> <path fill="#5E8E3E" d="M94.8,22.9c-0.5,0-9.3-0.2-9.3-0.2s-7.4-7.2-8.1-7.9c-0.3-0.3-0.6-0.4-1-0.5l0,109.7l33.1-8.2 c0,0-13.5-91.3-13.6-92C95.8,23.3,95.3,22.9,94.8,22.9z"/> <path fill="#FFFFFF" d="M58,39.9l-3.8,14.4c0,0-4.3-2-9.4-1.6c-7.5,0.5-7.5,5.2-7.5,6.4c0.4,6.4,17.3,7.8,18.3,22.9 c0.7,11.9-6.3,20-16.4,20.6c-12.2,0.8-18.9-6.4-18.9-6.4l2.6-11c0,0,6.7,5.1,12.1,4.7c3.5-0.2,4.8-3.1,4.7-5.1 c-0.5-8.4-14.3-7.9-15.2-21.7c-0.7-11.6,6.9-23.4,23.7-24.4C54.7,38.2,58,39.9,58,39.9z"/> </g> </g></svg>

<!-- the connector -->
<circle cx="290" cy="110" r="50" fill="none" stroke="#2b6be3" stroke-width="1.5" opacity="0.154"/>
<circle cx="290" cy="110" r="40" fill="none" stroke="#2b6be3" stroke-width="1.5" opacity="0.28"/>
<g filter="url(#lift)"><circle cx="290" cy="110" r="32" fill="url(#hub)"/></g>
<circle cx="290" cy="110" r="32" fill="url(#gloss)"/>
<g transform="translate(290,110)" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none">
  <path d="M-12,-6 H7"/><path d="M12,6 H-7"/>
</g>
<g transform="translate(290,110)" fill="#ffffff">
  <path d="M7,-11 L15,-6 L7,-1 Z"/><path d="M-7,1 L-15,6 L-7,11 Z"/>
</g>
</svg>
